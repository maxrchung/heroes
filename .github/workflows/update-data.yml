name: Check for Hero Updates

on:
  schedule:
    # Runs at 06:00 UTC every day
    - cron: "0 6 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write # Grants permission to commit and push back to repository

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Install HeroesDataParser
        run: dotnet tool install --global HeroesDataParser

      - name: Fetch raw data
        run: dotnet heroes-data-parser online -e hero:i -g 2 -o hdp

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Transform data
        run: npm run transform-data

      - name: Commit and push changes if found
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ public/images/
          if git diff --staged --quiet; then
            echo "No hero data or image updates found."
          else
            git commit -m "chore(data): auto-update hero data from HeroesDataParser"
            git push
          fi
